[project]
name = "ufc-analytics-project"
version = "0.1.0"
description = "A Streamlit web application for UFC analytics, providing insights, visualizations and predictions based on fight data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.12.3",
    "fastapi[standard]==0.115.6",
    "joblib==1.5.3",
    "matplotlib>=3.11.0",
    "numpy==2.2.0",
    "optuna>=4.9.0",
    "pandas==2.2.3",
    "playwright>=1.62.0",
    "plotly==5.24.1",
    "pyarrow==18.1.0",
    "pydantic-settings==2.7.1",
    "requests==2.32.3",
    "scikit-learn==1.5.2",
    "shap>=0.51.0",
    "sqlalchemy==2.0.36",
    "streamlit==1.41.1",
    "torch==2.5.1",
    "uvicorn[standard]==0.34.0",
    "watchdog>=6.0.0",
    "xgboost==2.1.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
